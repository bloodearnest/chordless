<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Drive Audit - Chordless</title>
    <link rel="stylesheet" href="/css/style.css" />
    <style>
      body {
        overflow: auto;
        padding: 2rem;
      }
      main {
        max-width: 70rem;
        margin: 0 auto;
      }
      h2 {
        margin-block: 1.5rem 0.5rem;
        font-weight: 600;
      }
      .problem {
        color: #c0392b;
      }
      .ok {
        color: #27ae60;
      }
      table {
        border-collapse: collapse;
        font-size: 0.85rem;
      }
      td,
      th {
        border: 1px solid #ccc;
        padding: 0.2rem 0.4rem;
        text-align: left;
      }
      pre {
        white-space: pre-wrap;
        font-size: 0.8rem;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Drive audit</h1>
      <p>
        Read-only check of the setlist files in your Drive <code>Chordless</code> folder: duplicates,
        files whose contents don't match their <code>setlistId</code>, and setlists sharing a date.
        Nothing is written to Drive or the local database.
      </p>
      <button id="run">Run audit</button>
      <button id="copy" disabled>Copy report JSON</button>
      <div id="status"></div>
      <div id="output"></div>
      <section id="cleanup" hidden>
        <h2>Cleanup</h2>
        <p>
          Organisation to keep: <select id="keep-org"></select>
        </p>
        <div id="cleanup-plan"></div>
        <p>
          <label
            ><input type="checkbox" id="cleanup-confirm" /> I've checked this list. Move these to the
            Google Drive trash (recoverable for 30 days).</label
          >
        </p>
        <button id="cleanup-run" disabled>Move to trash</button>
        <div id="cleanup-status"></div>
      </section>
    </main>

    <script type="module" src="/dev/drive-audit.js"></script>
  </body>
</html>
