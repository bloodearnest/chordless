<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    />
    <meta name="description" content="Setlist arrangement for worship songs" />
    <meta name="theme-color" content="#2c3e50" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" type="image/svg+xml" href="/icons/favicon-light.svg" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <title>Chordless</title>
    <link rel="stylesheet" href="/css/style.css" />
  </head>
  <body>
    <div class="app-container">
      <!-- The router shows the view for the URL here -->
      <div id="view-outlet"></div>

      <!-- Navigation menu component: stays while views come and go -->
      <nav-menu id="nav-menu"></nav-menu>
    </div>

    <!-- Media player (floating bottom-right): stays while views come and go, so playing carries on -->
    <media-player
      id="media-player"
      style="position: fixed; bottom: 1rem; right: 1rem; z-index: 1000"
    ></media-player>

    <!-- Tells screen readers about the page when the view changes -->
    <div id="route-announcer" class="visually-hidden" aria-live="polite"></div>

    <script>
      // Set window name so bookmarklet can find and reuse this tab
      window.name = 'chordless';

      // Register service worker
      if ('serviceWorker' in navigator) {
        // A page that loads before the service worker controls it runs without it (the
        // auth blob lives behind it), so on the very first visit reload once it is active.
        // The flag is set from the start until the page is controlled, so the page is
        // known to be settling (tests wait for it to go) and a failure cannot loop.
        const firstInstall =
          !navigator.serviceWorker.controller && !sessionStorage.getItem('sw-first-load');
        if (firstInstall) sessionStorage.setItem('sw-first-load', '1');

        navigator.serviceWorker
          .register('/service-worker.js')
          // Wait until it is active: a page that starts loading before then is not
          // controlled, and clients.claim() does not reach a page still being made
          .then(() => navigator.serviceWorker.ready)
          .then(registration => {
            console.log('Service Worker registered:', registration);
            if (firstInstall) {
              console.log('First install - reloading page to activate Service Worker');
              window.location.reload();
            } else if (navigator.serviceWorker.controller) {
              console.log('Service Worker is active and controlling page');
              sessionStorage.removeItem('sw-first-load');
            }
          })
          .catch(error => {
            console.error('Service Worker registration failed:', error);
          });
      }
    </script>

    <script type="module" src="/js/theme-manager.ts"></script>
    <script type="module" src="/js/app.ts"></script>
  </body>
</html>
