<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    />
    <meta name="description" content="Setlist arrangement for worship songs" />
    <meta name="theme-color" content="#2c3e50" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" type="image/svg+xml" href="/icons/favicon-light.svg" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <title>Chordless</title>
    <link rel="stylesheet" href="/css/style.css" />
  </head>
  <body>
    <div class="app-container">
      <!-- The router shows the view for the URL here -->
      <div id="view-outlet">
        <!-- Painted before any script runs; the first view replaces it -->
        <div class="boot-shell" aria-hidden="true">Chordless</div>
      </div>

      <!-- Navigation menu component: stays while views come and go -->
      <nav-menu id="nav-menu"></nav-menu>
    </div>

    <!-- Media player (floating at the frame's bottom-right): stays while views come and go, so playing carries on -->
    <media-player id="media-player"></media-player>

    <!-- Says the device is live, and how to leave: stays while views come and go -->
    <live-indicator id="live-indicator"></live-indicator>

    <!-- Tells screen readers about the page when the view changes -->
    <div id="route-announcer" class="visually-hidden" aria-live="polite"></div>

    <script src="/boot.js"></script>

    <script type="module" src="/js/theme-manager.ts"></script>
    <script type="module" src="/js/app.ts"></script>
  </body>
</html>
