name = "chordless"
main = "worker/src/index.ts"
compatibility_date = "2024-09-23"
compatibility_flags = ["nodejs_compat"]

# No `routes`: the custom domain chordless.app is attached to this worker in Terraform
# (infra/cloudflare), its one owner, so a deploy leaves it alone. Without `routes`, wrangler would
# turn on the workers.dev address and preview URLs by default: chordless.app is the only address.
workers_dev = false
preview_urls = false

# Worker logs in the dashboard (Workers > chordless > Logs). The email handler logs only
# errors, never the email's content.
[observability.logs]
enabled = true
invocation_logs = true

# Limits on the emails the import address answers (worker/src/email.ts): an email over one is
# dropped without a reply. Per sender, and overall (forged sender addresses get round the first).
# period is 10 or 60 seconds. The namespace ids only have to be unique in the account.
[[ratelimits]]
name = "EMAIL_PER_SENDER"
namespace_id = "7301"
simple = { limit = 5, period = 60 }

[[ratelimits]]
name = "EMAIL_OVERALL"
namespace_id = "7302"
simple = { limit = 30, period = 60 }

[assets]
directory = "src"
not_found_handling = "single-page-application"
# Serve files at the URL they have (/dev/theme.html stays that), no .html stripping
html_handling = "none"
binding = "ASSETS"
# Paths the worker handles before static assets. API routes must be listed:
# otherwise the SPA fallback answers them (POST -> 405) and the worker never runs.
# /dev is listed so the worker can hide the dev-only pages in production.
run_worker_first = ["/oauth/*", "/session/*", "/api/config", "/api/share/*", "/api/space/*", "/api/spaces", "/api/spaces/*", "/s/*", "/dev", "/dev/*"]

# One Durable Object per team space (worker/src/team-space.ts): its members and roles, the files in
# its tree, and the owner's encrypted token blob. Never song, setlist or pad content.
[[durable_objects.bindings]]
name = "TEAM_SPACE"
class_name = "TeamSpace"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["TeamSpace"]

# Secrets (set via `wrangler secret put`):
# - JWE_ENCRYPTION_KEY: Symmetric key for encrypting/decrypting token blobs (base64 encoded)
# - GOOGLE_CLIENT_ID: Google OAuth client ID
# - GOOGLE_CLIENT_SECRET: Google OAuth client secret
# - GOOGLE_API_KEY: Google API key restricted to the Drive API, for share link downloads
# - PICKER_API_KEY: the Team Key (browser key restricted to the Picker API and our addresses), which the
#   page fetches from /api/config for the team space folder picker

# Local development settings: `npm run dev` runs `wrangler dev --env dev`.
# Secrets still come from .dev.vars.
[env.dev]
# Environments don't inherit ratelimits, so the email handler has them here too (same limits)
[[env.dev.ratelimits]]
name = "EMAIL_PER_SENDER"
namespace_id = "7301"
simple = { limit = 5, period = 60 }

[[env.dev.ratelimits]]
name = "EMAIL_OVERALL"
namespace_id = "7302"
simple = { limit = 30, period = 60 }

# (so do Durable Objects and their migrations)
[[env.dev.durable_objects.bindings]]
name = "TEAM_SPACE"
class_name = "TeamSpace"

[[env.dev.migrations]]
tag = "v1"
new_sqlite_classes = ["TeamSpace"]

[env.dev.vars]
# Serve the component playgrounds in src/dev/ (404 in production)
DEV_PAGES = "true"
