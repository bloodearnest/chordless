name = "chordless-auth-proxy"
main = "worker/src/index.js"
compatibility_date = "2024-09-23"
compatibility_flags = ["nodejs_compat"]

[assets]
directory = "src"
not_found_handling = "single-page-application"
# Serve files at the URL they have (/dev/theme.html stays that), no .html stripping
html_handling = "none"
binding = "ASSETS"
# Paths the worker handles before static assets. API routes must be listed:
# otherwise the SPA fallback answers them (POST -> 405) and the worker never runs.
# /dev is listed so the worker can hide the dev-only pages in production.
run_worker_first = ["/oauth/*", "/session/*", "/dev", "/dev/*"]

# Secrets (set via `wrangler secret put`):
# - JWE_ENCRYPTION_KEY: Symmetric key for encrypting/decrypting token blobs (base64 encoded)
# - GOOGLE_CLIENT_ID: Google OAuth client ID
# - GOOGLE_CLIENT_SECRET: Google OAuth client secret

# Local development settings: `npm run dev` runs `wrangler dev --env dev`.
# Secrets still come from .dev.vars.
[env.dev]
[env.dev.vars]
# Serve the component playgrounds in src/dev/ (404 in production)
DEV_PAGES = "true"
