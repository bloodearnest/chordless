name = "chordless"
main = "worker/src/index.ts"
compatibility_date = "2024-09-23"
compatibility_flags = ["nodejs_compat"]

# Production: serve chordless.app from this worker. The route creates the DNS record, so the
# domain must not be attached to another Pages project or worker first.
routes = [{ pattern = "chordless.app", custom_domain = true }]

# Worker logs in the dashboard (Workers > chordless > Logs). The email handler logs only
# errors, never the email's content.
[observability.logs]
enabled = true
invocation_logs = true

[assets]
directory = "src"
not_found_handling = "single-page-application"
# Serve files at the URL they have (/dev/theme.html stays that), no .html stripping
html_handling = "none"
binding = "ASSETS"
# Paths the worker handles before static assets. API routes must be listed:
# otherwise the SPA fallback answers them (POST -> 405) and the worker never runs.
# /dev is listed so the worker can hide the dev-only pages in production.
run_worker_first = ["/oauth/*", "/session/*", "/api/share/*", "/s/*", "/dev", "/dev/*"]

# Secrets (set via `wrangler secret put`):
# - JWE_ENCRYPTION_KEY: Symmetric key for encrypting/decrypting token blobs (base64 encoded)
# - GOOGLE_CLIENT_ID: Google OAuth client ID
# - GOOGLE_CLIENT_SECRET: Google OAuth client secret
# - GOOGLE_API_KEY: Google API key restricted to the Drive API, for share link downloads

# Local development settings: `npm run dev` runs `wrangler dev --env dev`.
# Secrets still come from .dev.vars.
[env.dev]
[env.dev.vars]
# Serve the component playgrounds in src/dev/ (404 in production)
DEV_PAGES = "true"
