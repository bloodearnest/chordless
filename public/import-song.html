<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Import songs from files, pasted text or SongSelect" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" type="image/svg+xml" href="/icons/favicon-light.svg" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <title>Import Songs - Chordless</title>
    <link rel="stylesheet" href="/css/style.css" />

    <!-- Import map for Lit -->
    <script type="importmap">
      {
        "imports": {
          "lit": "/vendor/lit/index.js",
          "lit/": "/vendor/lit/",
          "@lit/reactive-element": "/vendor/@lit/reactive-element/reactive-element.js",
          "@lit/reactive-element/": "/vendor/@lit/reactive-element/",
          "lit-element/lit-element.js": "/vendor/lit-element/lit-element.js",
          "lit-html": "/vendor/lit-html/lit-html.js",
          "lit-html/": "/vendor/lit-html/"
        }
      }
    </script>
  </head>
  <body>
    <div class="app-container">
      <div class="view">
        <header>
          <button class="nav-menu-button" id="nav-menu-button" aria-label="Navigation menu">
            <svg
              width="24"
              height="24"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
            >
              <line x1="3" y1="12" x2="21" y2="12"></line>
              <line x1="3" y1="6" x2="21" y2="6"></line>
              <line x1="3" y1="18" x2="21" y2="18"></line>
            </svg>
          </button>
          <h1>Import Songs</h1>
          <div></div>
        </header>
        <nav-menu id="nav-menu" for="nav-menu-button"></nav-menu>

        <song-import></song-import>
      </div>
    </div>

    <script>
      // Set window name so bookmarklet can find and reuse this tab
      window.name = 'chordless';
    </script>
    <!-- Initialize theme manager (loads saved preferences automatically) -->
    <script type="module" src="/js/theme-manager.js"></script>

    <script type="module" src="/components/nav-menu.js"></script>
    <script type="module" src="/components/song-import.js"></script>
  </body>
</html>
