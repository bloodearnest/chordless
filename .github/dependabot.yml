# Dependabot's pull requests go through CI like any other. `cooldown` waits a week after a release
# before proposing it, by which time a compromised one has usually been found and pulled.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      dependencies:
        dependency-type: production
      dev-dependencies:
        dependency-type: development
