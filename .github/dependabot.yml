# Dependabot's pull requests go through CI like any other (docs/CI.md).
# - One pull request a week, of every npm package and action with a new version (a multi-ecosystem
#   group), rather than one per package.
# - `cooldown` waits a week after a release before proposing it, by which time a compromised one
#   has usually been found and pulled.
# - Security updates come when an alert does, not weekly: those at once are one pull request too.
version: 2

multi-ecosystem-groups:
  weekly:
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/London

updates:
  - package-ecosystem: npm
    directory: /
    multi-ecosystem-group: weekly
    patterns: ["*"]
    cooldown:
      default-days: 7
    # Held back on purpose, until they are dealt with by hand:
    # - unpdf 2 bundles a pdf.js that needs Promise.try, Float16Array and Math.sumPrecise, which
    #   Node 22 and our browser floor (Safari 17.4, Chrome 120) do not have.
    # - verovio is pinned to the version SongSelect prints with (docs/MELODY.md); 6.4.0 changes the
    #   PDF the melody is read back from ("tie joins no heads").
    ignore:
      - dependency-name: unpdf
        update-types: ["version-update:semver-major"]
      - dependency-name: verovio
    groups:
      security:
        applies-to: security-updates
        patterns: ["*"]

  # The Terraform providers of each stack in infra/ (their versions and .terraform.lock.hcl). Not the
  # Terraform CLI: that is pinned in mise.toml, which Renovate updates (.github/renovate.json5). A
  # merged bump runs the Terraform workflow, which plans and waits for the owner before any apply.
  - package-ecosystem: terraform
    directories: ["/infra/*"]
    multi-ecosystem-group: weekly
    patterns: ["*"]
    cooldown:
      default-days: 7

  - package-ecosystem: github-actions
    directory: /
    multi-ecosystem-group: weekly
    patterns: ["*"]
    cooldown:
      default-days: 7
