# zizmor's settings (`just lint-actions`; docs/CI.md)
rules:
  # It asks for GitHub's `$/` self-repository syntax for our own actions, which actionlint 1.7.12
  # rejects as an action with no ref. The jobs check the repository out first anyway (the scripts
  # are in it), so `./` names the same commit. Turn this back on when actionlint knows `$/`.
  self-repository:
    disable: true
  # `workflow_run` runs with a write token, and is dangerous when it checks out or runs what the run it
  # follows built (a pull request's code). rerun-unacquired.yml does neither: it checks out the default
  # branch, and uses only the run's id, attempt, commit SHA and pull request number (all numbers or hex),
  # passed in `env`, to ask the API whether a job was never given a runner and to re-run it. Only this file.
  dangerous-triggers:
    ignore:
      - rerun-unacquired.yml
