# Terraform in CI (scripts/terraform-ci.sh; docs/CI.md), for the stacks it has credentials for.
# - Nightly: plan everything, and fail on drift (something changed outside the code); and by hand.
# - A change that reaches main is planned with read-only credentials (`infra`), and applied exactly
#   once the owner approves it (`infra-apply`, whose reviewer the run waits for), by deploy.yml, before
#   its deploy: it has the same two jobs (the steps are in .github/actions/terraform-*). The plan is in
#   the run's summary, to read before approving.
# Pull requests run none of this: they have no secrets (`just lint-infra` checks infra/ there).
name: Terraform

on:
  schedule:
    - cron: "30 3 * * *"
  workflow_dispatch:

permissions: {}

# One at a time, and none cancelled: an apply must not be cut short
concurrency:
  group: terraform
  cancel-in-progress: false

jobs:
  plan:
    name: Plan
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: infra
    permissions:
      contents: read
      # (to sign in to Google with no stored key: scripts/ci/google-auth.sh)
      id-token: write
    outputs:
      changed: ${{ steps.plan.outputs.changed }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: plan
        uses: ./.github/actions/terraform-plan
        with:
          drift: ${{ github.event_name == 'schedule' }}
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          github-token: ${{ secrets.GH_TERRAFORM_TOKEN }}
          r2-token-expires: ${{ vars.R2_TOKEN_EXPIRES }}
          cloudflare-token: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          cloudflare-token-expires: ${{ vars.CLOUDFLARE_TOKEN_EXPIRES }}

  apply:
    name: Apply
    needs: plan
    if: needs.plan.outputs.changed == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: infra-apply
    permissions:
      contents: read
      # (to sign in to Google with no stored key: scripts/ci/google-auth.sh)
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/terraform-apply
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          github-token: ${{ secrets.GH_TERRAFORM_TOKEN }}
          cloudflare-token: ${{ secrets.CLOUDFLARE_API_TOKEN }}
