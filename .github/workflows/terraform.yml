# Terraform in CI (scripts/terraform-ci.sh; docs/CI.md), for the stacks it has credentials for.
# - A change to infra/ on main: plan it with read-only credentials (`infra`), and apply exactly that
#   plan once the owner approves it (`infra-apply`, whose reviewer the run waits for). The plan is in
#   the run's summary, to read before approving.
# - Nightly: plan everything, and fail on drift (something changed outside the code).
# deploy.yml has the same two jobs before its deploy (the steps are in .github/actions/terraform-*).
# Pull requests run none of this: they have no secrets (`just lint-infra` checks infra/ there).
name: Terraform

on:
  # (until deploy.yml runs on every push to main, which then plans and applies the same: remove this
  # trigger then)
  push:
    branches: [main]
    paths: ["infra/**"]
  schedule:
    - cron: "30 3 * * *"
  workflow_dispatch:

permissions: {}

# One at a time, and none cancelled: an apply must not be cut short
concurrency:
  group: terraform
  cancel-in-progress: false

jobs:
  plan:
    name: Plan
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: infra
    permissions:
      contents: read
    outputs:
      changed: ${{ steps.plan.outputs.changed }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: plan
        uses: ./.github/actions/terraform-plan
        with:
          drift: ${{ github.event_name == 'schedule' }}
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          github-token: ${{ secrets.GH_TERRAFORM_TOKEN }}
          r2-token-expires: ${{ vars.R2_TOKEN_EXPIRES }}
          cloudflare-token: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          cloudflare-token-expires: ${{ vars.CLOUDFLARE_TOKEN_EXPIRES }}

  apply:
    name: Apply
    needs: plan
    if: needs.plan.outputs.changed == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: infra-apply
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/terraform-apply
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          github-token: ${{ secrets.GH_TERRAFORM_TOKEN }}
          cloudflare-token: ${{ secrets.CLOUDFLARE_API_TOKEN }}
