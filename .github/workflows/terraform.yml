# Terraform in CI (scripts/terraform-ci.sh; docs/CI.md), for the stacks it has credentials for.
# - A change to infra/ on main: plan it with read-only credentials (`infra`), and apply exactly that
#   plan once the owner approves it (`infra-apply`, whose reviewer the run waits for). The plan is in
#   the run's summary, to read before approving.
# - Nightly: plan everything, and fail on drift (something changed outside the code).
# Pull requests run none of this: they have no secrets (`just lint-infra` checks infra/ there).
name: Terraform

on:
  push:
    branches: [main]
    paths: ["infra/**"]
  schedule:
    - cron: "30 3 * * *"
  workflow_dispatch:

permissions: {}

# One at a time, and none cancelled: an apply must not be cut short
concurrency:
  group: terraform
  cancel-in-progress: false

jobs:
  plan:
    name: Plan
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: infra
    permissions:
      contents: read
    outputs:
      changed: ${{ steps.plan.outputs.changed }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # (the commit before the push, to see which stacks changed)
          fetch-depth: 0
      - run: scripts/ci/setup-tools.sh terraform
      # (fails within a week of a credential running out: the nightly run tells the owner in time)
      - run: scripts/ci/check-expiry.sh
        env:
          GITHUB_TOKEN: ${{ secrets.GH_TERRAFORM_TOKEN }}
          R2_TOKEN_EXPIRES: ${{ vars.R2_TOKEN_EXPIRES }}
      - id: plan
        run: |
          if [ "$EVENT" = schedule ]; then
            scripts/terraform-ci.sh drift
          else
            scripts/terraform-ci.sh plan "$BEFORE" | tee -a "$GITHUB_OUTPUT"
          fi
        env:
          EVENT: ${{ github.event_name }}
          # (empty on a manual run: every stack)
          BEFORE: ${{ github.event.before }}
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          GITHUB_TOKEN: ${{ secrets.GH_TERRAFORM_TOKEN }}
      # The plans hold no secrets (Terraform is given none: infra/README.md), but artifacts of a public
      # repository can be downloaded by anyone signed in to GitHub: kept for a day
      - if: steps.plan.outputs.changed == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: terraform-plans
          path: plans/*.tfplan
          retention-days: 1

  apply:
    name: Apply
    needs: plan
    if: needs.plan.outputs.changed == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: infra-apply
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: scripts/ci/setup-tools.sh terraform
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: terraform-plans
          path: plans
      - run: scripts/terraform-ci.sh apply
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          GITHUB_TOKEN: ${{ secrets.GH_TERRAFORM_TOKEN }}
