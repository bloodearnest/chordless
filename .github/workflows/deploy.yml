# Deploy chordless.app (docs/CI.md). In order, so a deploy never runs before what it depends on:
#   ci         the checks (ci.yml), on this commit
#   plan, apply  Terraform, as terraform.yml (the steps are shared, .github/actions/terraform-*): every
#              stack planned, and applied once the owner approves, if anything differs. A rejected or
#              failed apply stops the deploy
#   build      with no secrets: the build and its hash (scripts/build-hash.ts), kept for the deploy
#   deploy     in `production`, the only job with the Cloudflare token: skipped when the live site
#              already runs this build; otherwise deployed, smoke tested, and rolled back on failure
# Only wrangler deploys (infra/README.md): Terraform never touches the Worker, its assets or secrets.
#
# On every push to main (a merge), and by hand (Actions, Deploy, Run workflow). This is also where
# main's own checks run after a merge (ci.yml has no push trigger), which is what a pull request not
# having to be up to date relies on (docs/CI.md). A merge of only docs/**.md and TODO starts no
# run. One that changes anything else runs the checks and the plan (deploying nothing, if nothing
# shipped changed).
name: Deploy

on:
  push:
    branches: [main]
    # A push of only these (notes, nothing shipped or checked) starts no run; one that also changes
    # anything else does. Keep in step with scripts/ci/changes.sh
    paths-ignore:
      - "docs/**.md"
      - TODO
  # Every morning but Sunday, to deploy what a push did not: a merge made with a workflow's token
  # (Dependabot's auto-merge) starts no workflow, so its change, and the checks on it, wait for the
  # next run. Monday to Saturday at 07:30 UTC, after Dependabot's morning (06:00 London); not Saturday
  # night or Sunday, which is when the app is used most. The infrastructure is not planned here: the
  # nightly drift check (terraform.yml) does that
  schedule:
    - cron: "30 7 * * 1-6"
  workflow_dispatch:
    inputs:
      force:
        description: Deploy even if the live site already runs this build
        type: boolean
        default: false
      skip_infra:
        description: Do not plan or apply the infrastructure first (a fix while a plan is failing)
        type: boolean
        default: false

permissions: {}

# One at a time, and none cancelled: a deploy must not be cut short. (Another run waiting is replaced
# by a newer one, which is the one to deploy; deploy's guard below skips a run that is not the newest.)
concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  ci:
    name: CI
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  plan:
    name: Infrastructure plan
    # Not on the schedule (the nightly drift check does that), nor when a manual run skips it
    if: github.event_name != 'schedule' && !inputs.skip_infra
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: infra
    permissions:
      contents: read
      # (to sign in to Google with no stored key: scripts/ci/google-auth.sh)
      id-token: write
    outputs:
      changed: ${{ steps.plan.outputs.changed }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: plan
        uses: ./.github/actions/terraform-plan
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          github-token: ${{ secrets.GH_TERRAFORM_TOKEN }}
          r2-token-expires: ${{ vars.R2_TOKEN_EXPIRES }}
          cloudflare-token: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          cloudflare-token-expires: ${{ vars.CLOUDFLARE_TOKEN_EXPIRES }}

  apply:
    name: Infrastructure apply
    needs: plan
    if: needs.plan.outputs.changed == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: infra-apply
    permissions:
      contents: read
      # (to sign in to Google with no stored key: scripts/ci/google-auth.sh)
      id-token: write
    # (the group terraform.yml has, so a push to infra/ and a deploy do not apply at once)
    concurrency:
      group: terraform
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/terraform-apply
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          github-token: ${{ secrets.GH_TERRAFORM_TOKEN }}
          cloudflare-token: ${{ secrets.CLOUDFLARE_API_TOKEN }}

  build:
    name: Build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    outputs:
      hash: ${{ steps.hash.outputs.hash }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # The whole history: the build's release date is the last commit that touched the app's
          # files (vite-plugins/service-worker.ts), which a one-commit clone answers with the newest
          # commit whatever it touched, so every merge would look like a new build
          fetch-depth: 0
      - uses: ./.github/actions/setup
        with:
          tools: node
      - run: npx vite build
      - id: hash
        run: echo "hash=$(node scripts/build-hash.ts)" | tee -a "$GITHUB_OUTPUT"
      # Public anyway (it is the site), but kept a day only: anyone signed in to GitHub can download it
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist
          retention-days: 1

  deploy:
    name: Deploy
    needs: [ci, plan, apply, build]
    # !cancelled() so the skipped apply (nothing to apply) does not skip this too
    if: >-
      !cancelled() && needs.ci.result == 'success'
      && (needs.plan.result == 'success' || needs.plan.result == 'skipped')
      && (needs.apply.result == 'success' || needs.apply.result == 'skipped')
      && needs.build.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment:
      name: production
      # (GitHub lists each deploy against this address, in the repository's Deployments)
      url: https://chordless.app
    permissions:
      contents: read
    env:
      HASH: ${{ needs.build.outputs.hash }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - if: inputs.skip_infra
        run: echo "The infrastructure was not planned or applied (skip_infra)." | tee -a "$GITHUB_STEP_SUMMARY"
      # Not the newest commit on main: a newer run will deploy it, and this one must not put an older
      # build over it
      - id: newest
        env:
          REPOSITORY: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          head=$(git ls-remote "https://github.com/$REPOSITORY" refs/heads/main | cut -f1)
          if [ "$head" = "$SHA" ]; then
            echo "deploy=true" >>"$GITHUB_OUTPUT"
          else
            echo "deploy=false" >>"$GITHUB_OUTPUT"
            echo "::notice::main has moved on to ${head:0:7}: not deploying ${SHA:0:7}"
          fi
      # What the live site runs: the same build is not deployed again (a failed or rolled back deploy
      # differs, so it is tried again)
      - id: live
        if: steps.newest.outputs.deploy == 'true'
        env:
          FORCE: ${{ inputs.force }}
        run: |
          live=$(scripts/ci/live-hash.sh)
          if [ "$live" = "$HASH" ] && [ "$FORCE" != true ]; then
            echo "deploy=false" >>"$GITHUB_OUTPUT"
            echo "The live site already runs this build (${HASH:0:12}): nothing to deploy." | tee -a "$GITHUB_STEP_SUMMARY"
          else
            echo "deploy=true" >>"$GITHUB_OUTPUT"
            echo "Live: ${live:0:12}; deploying: ${HASH:0:12}"
          fi
      - if: steps.live.outputs.deploy == 'true'
        run: scripts/ci/setup-tools.sh node
      # (no cache: the job with the token runs what it installs itself)
      - if: steps.live.outputs.deploy == 'true'
        run: mise exec -- npm ci
      - if: steps.live.outputs.deploy == 'true'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist
      - if: steps.live.outputs.deploy == 'true'
        run: mise exec -- node scripts/check-prod-secrets.ts
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      - if: steps.live.outputs.deploy == 'true'
        run: mise exec -- npx wrangler deploy --config dist/chordless/wrangler.json
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      - id: smoke
        if: steps.live.outputs.deploy == 'true'
        run: scripts/ci/smoke.sh "$HASH"
      # The previous version takes over again (Durable Object migrations are not undone: they only add)
      - if: failure() && steps.smoke.conclusion == 'failure'
        run: mise exec -- npx wrangler rollback --yes --message "smoke test failed for ${SHA:0:7}"
        env:
          SHA: ${{ github.sha }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      - if: steps.live.outputs.deploy == 'true' && steps.smoke.conclusion == 'success'
        run: echo "Deployed ${HASH:0:12} (${GITHUB_SHA:0:7})." | tee -a "$GITHUB_STEP_SUMMARY"
