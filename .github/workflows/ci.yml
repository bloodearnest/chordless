# The checks on every pull request, and on main before a deploy (deploy.yml calls this). Each job is
# a `just` recipe, so `just ci` runs the Linux jobs' checks locally (docs/CI.md). The one check a
# pull request needs to pass is `ci-ok`.
name: CI

on:
  pull_request:
  workflow_call:
  workflow_dispatch:
  # Weekly on main: keeps the caches from expiring in a quiet week, and checks the pinned tools
  # and runner images still work
  schedule:
    - cron: "0 6 * * 1"

permissions: {}

concurrency:
  # A new push to a pull request cancels its run; runs on main all finish
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # Caches are saved on main only, which pull requests read (docs/CI.md)
  SAVE_CACHE: ${{ github.ref == 'refs/heads/main' }}

jobs:
  changes:
    name: Changes
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      code: ${{ steps.changes.outputs.code }}
      infra: ${{ steps.changes.outputs.infra }}
      lockfile: ${{ steps.changes.outputs.lockfile }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - id: changes
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
        run: scripts/ci/changes.sh "$BASE" | tee -a "$GITHUB_OUTPUT"

  lint:
    name: Lint
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: setup
        uses: ./.github/actions/setup
        with:
          tools: node just actionlint zizmor shellcheck terraform
      - run: just lint
        env:
          # zizmor's online audits (impostor-commit) read the actions' repositories
          GH_TOKEN: ${{ github.token }}
      - if: env.SAVE_CACHE == 'true'
        uses: ./.github/actions/save-cache
        with:
          setup: ${{ steps.setup.outputs.save }}

  node:
    name: Node tests
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          tools: node just
      - run: just test-node
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: node-coverage
          path: .stats/node.lcov
          retention-days: 3

  unit:
    name: Unit tests
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: setup
        uses: ./.github/actions/setup
        with:
          tools: node just
          browser: chromium
      - run: just test-unit
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: unit-coverage
          path: coverage/lcov.info
          retention-days: 3
      # The one job that saves the Linux packages and Chromium (e2e-linux shares them)
      - if: env.SAVE_CACHE == 'true'
        uses: ./.github/actions/save-cache
        with:
          setup: ${{ steps.setup.outputs.save }}

  coverage:
    name: Coverage
    # Skipped with the two it waits for
    needs: [node, unit]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          tools: node just
          npm: "false"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: node-coverage
          path: .stats
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: unit-coverage
          path: coverage
      # Fails if any file has more missing than docs/coverage-floor.json allows; never writes it
      - run: just coverage-check

  e2e-linux:
    name: End to end (Linux, Chromium)
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          tools: node just
          browser: chromium
      - run: scripts/ci/fake-dev-vars.sh
      - run: just test-e2e chromium
        env:
          # Three browsers at once on the runner's four processors: 2.0 minutes, to 2.4 with two
          CHORDLESS_WORKERS: 3
      # Which tests only passed on a retry (retries: 2 would hide them)
      - if: always()
        run: node scripts/flaky-summary.ts
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-linux-chromium-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  e2e:
    name: End to end (${{ matrix.name }})
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          # (2 workers: 3.8 minutes; 3 were slower on its three processors, 4.8)
          - name: macOS, WebKit
            os: macos-15
            browser: webkit
            workers: 2
          # Edge, as Windows' own browser (Chrome's engine is the Linux job's)
          - name: Windows, Edge
            os: windows-2025
            browser: msedge
            workers: 3
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: setup
        uses: ./.github/actions/setup
        with:
          tools: node just
          browser: ${{ matrix.browser }}
      - run: scripts/ci/fake-dev-vars.sh
      # Not the tests tagged @logic: they do not depend on the browser or the platform, and Linux runs
      # them. The weekly run, and a run by hand, run them here too
      - run: |
          if [ "$EVENT" = schedule ] || [ "$EVENT" = workflow_dispatch ]; then
            just test-e2e "$BROWSER"
          else
            just test-e2e "$BROWSER" --grep-invert @logic
          fi
        env:
          EVENT: ${{ github.event_name }}
          BROWSER: ${{ matrix.browser }}
          CHORDLESS_WORKERS: ${{ matrix.workers }}
      - if: always()
        run: node scripts/flaky-summary.ts
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-${{ matrix.browser }}-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
      - if: env.SAVE_CACHE == 'true'
        uses: ./.github/actions/save-cache
        with:
          setup: ${{ steps.setup.outputs.save }}

  # Only when the lockfile changed: the new versions are then the pull request's doing. Any other
  # day's new advisory is the Advisories workflow's, which holds nothing up
  advisories:
    name: Advisories
    needs: changes
    if: needs.changes.outputs.lockfile == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          tools: node just
      - run: just advisories

  infra:
    name: Terraform
    needs: changes
    if: needs.changes.outputs.infra == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          tools: just terraform
          npm: "false"
      - run: just lint-infra

  # The one required check: every job above passed, or was skipped as not needed (a change of
  # prose only, nothing in infra/, an unchanged lockfile)
  ci-ok:
    name: ci-ok
    if: always()
    needs: [changes, lint, node, unit, coverage, e2e-linux, e2e, advisories, infra]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions: {}
    steps:
      - env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          jq -r 'to_entries[] | "\(.key): \(.value.result)"' <<<"$RESULTS"
          jq -e 'all(.[]; .result == "success" or .result == "skipped")' <<<"$RESULTS" >/dev/null
