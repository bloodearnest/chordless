# What CodeQL checks (.github/workflows/codeql.yml; docs/CI.md). Its findings block a merge at the
# thresholds in the main ruleset (infra/github). When a query proves noisy here, turn it off below
# (`query-filters`, with the reason) rather than dismissing the same finding over and over; dismiss a
# single false positive in the repository's Security tab, with a reason.
name: chordless

# The queries: CodeQL's default suite, its high-precision ones, which is what it runs when none are
# named here (`queries: [{uses: security-extended}]` would add many more, and most of the false
# positives with them)

# Code that never runs in a user's browser or the Worker
paths-ignore:
  - tests
  - src/dev
  - icon-tooling
  - scripts
  - vite-plugins
  - "**/*.config.{js,ts}"

